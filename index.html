<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سجّل دخولك إلى سنمار</title>
    <!-- استدعاء Firebase Web SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        @font-face {
            font-family: 'font1';
            src: url('fonts/font1.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'font1', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #FC5700;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
        }

        /* الجزء العلوي الهيدر */
        .header {
            width: 100%;
            padding: 40px 20px 20px 20px;
            text-align: center;
            color: #FFFFFF;
        }

        .logo-box {
            width: 60px;
            height: 60px;
            background-color: #FFFFFF;
            border-radius: 16px;
            margin: 0 auto 15px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .logo-box svg {
            width: 32px;
            height: 32px;
            fill: #FC5700;
        }

        .header h1 {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 12px;
            line-height: 1.6;
            opacity: 0.95;
            max-width: 280px;
            margin: 0 auto;
        }

        /* الحاوية البيضاء الرئيسية */
        .main-card {
            background-color: #FFFFFF;
            width: 100%;
            flex-grow: 1;
            border-top-left-radius: 35px;
            border-top-right-radius: 35px;
            padding: 30px 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.05);
        }

        .form-group {
            width: 100%;
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            color: #2D3142;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .input-box {
            display: flex;
            align-items: center;
            border: 1px solid #E0E0E0;
            border-radius: 12px;
            padding: 0 12px;
            height: 48px;
            background-color: #FFFFFF;
            box-shadow: 0 3px 6px rgba(0,0,0,0.03);
            transition: border-color 0.2s;
        }

        .input-box:focus-within {
            border-color: #FC5700;
        }

        .input-box svg {
            width: 20px;
            height: 20px;
            fill: #FC5700;
            margin-left: 10px;
            flex-shrink: 0;
        }

        .input-box input {
            border: none;
            outline: none;
            width: 100%;
            height: 100%;
            font-size: 13px;
            color: #333333;
            direction: ltr;
            text-align: right;
            background: transparent;
        }

        .links-container {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .link-register {
            color: #2D3142;
            font-size: 12px;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        .link-forgot {
            color: #D32F2F;
            font-size: 12px;
            text-decoration: none;
            cursor: pointer;
        }

        /* زر تسجيل الدخول */
        .footer-action {
            width: 100%;
            padding: 15px 25px 25px 25px;
            background-color: #FFFFFF;
        }

        .btn-submit {
            width: 100%;
            height: 48px;
            background-color: #FC5700;
            color: #FFFFFF;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(252, 87, 0, 0.3);
        }

        .btn-submit:active {
            opacity: 0.9;
        }

        /* النافذة المنبثقة (ProgressDialog & ErrorDialog) */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .dialog-card {
            background: #FFFFFF;
            border-radius: 25px;
            padding: 22px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        /* Spinner التحميل */
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #F3F3F3;
            border-top: 3px solid #FC5700;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .dialog-text {
            color: #424242;
            font-size: 13px;
        }

        .err-text {
            color: #424242;
            font-size: 11px;
            margin-bottom: 15px;
        }

        .btn-container {
            display: flex;
            width: 100%;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-cancel {
            flex: 0.7;
            height: 38px;
            background: transparent;
            border: none;
            color: #9E9E9E;
            font-size: 11px;
            cursor: pointer;
        }

        .btn-register-dialog {
            flex: 1;
            height: 38px;
            background: #FC5700;
            border: none;
            border-radius: 14px;
            color: #FFFFFF;
            font-size: 13px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- الهيدر -->
    <div class="header">
        <div class="logo-box">
            <svg viewBox="0 0 24 24"><path d="M19 6h-2c0-2.76-2.24-5-5-5S7 3.24 7 6H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-7-3c1.66 0 3 1.34 3 3H9c0-1.66 1.34-3 3-3zm0 10c-2.76 0-5-2.24-5-5h2c0 1.66 1.34 3 3 3s3-1.34 3-3h2c0 2.76-2.24 5-5 5z"/></svg>
        </div>
        <h1>سجّل دخولك إلى سنمار</h1>
        <p>للوصول إلى لوحة التحكم الخاصة بك وإدارة عمليات البيع والتسوق بكل سلاسة.</p>
    </div>

    <!-- الكارت الأبيض للنموذج -->
    <div class="main-card">
        <div class="form-group">
            <label class="form-label">رقم الهاتف</label>
            <div class="input-box" id="linear16">
                <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                <input type="tel" id="edittext1" placeholder="078XXXXXXXX" dir="ltr">
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">كلمة السر</label>
            <div class="input-box" id="linear17">
                <svg viewBox="0 0 24 24"><path d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v2h2v-2h2v-2h-8.35zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
                <input type="password" id="edittext2" placeholder="اكتب كلمة السر" dir="ltr">
            </div>
        </div>

        <div class="links-container" id="linear20">
            <span class="link-register" onclick="goToRegister()">انشاء حساب جديد</span>
            <span class="link-forgot" onclick="openInstagram()">نسيت كلمة السر</span>
        </div>
    </div>

    <!-- زر تسجيل الدخول -->
    <div class="footer-action">
        <button class="btn-submit" onclick="loginProcess()">تسجيل الدخول</button>
    </div>

    <!-- نافذة جاري التحقق -->
    <div class="overlay" id="loadingDialog">
        <div class="dialog-card" style="width: 82%;">
            <div class="spinner"></div>
            <div class="dialog-text">جاري التحقق من الحساب...</div>
        </div>
    </div>

    <!-- نافذة رسائل الخطأ -->
    <div class="overlay" id="errorDialog">
        <div class="dialog-card" style="width: 70%;">
            <div class="err-text" id="errorMsg"></div>
            <div class="btn-container">
                <button class="btn-cancel" onclick="closeErrorDialog()">إلغاء</button>
                <button class="btn-register-dialog" onclick="goToRegister()">إنشاء حساب</button>
            </div>
        </div>
    </div>

    <script>
        // إعدادات Firebase 
        const firebaseConfig = {
            databaseURL: "https://alihsn-3c914-default-rtdb.firebaseio.com/" // ضع رابط داتابيز الفايربيس هنا
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const fdb_users = firebase.database().ref("users");

        // الفحص التلقائي للدخول المسبق (SharedPreferences)
        window.onload = function() {
            const savedPhone = localStorage.getItem("user_phone") || "";
            if (savedPhone !== "") {
                window.location.href = "AsasehActivity.html";
            }
        };

        // منع اللغة العربية في كلمة السر (Input Filter)
        document.getElementById('edittext2').addEventListener('input', function(e) {
            this.value = this.value.replace(/[^a-zA-Z0-9._@#$%^&+=!*]/g, '');
        });

        // زر نسيت كلمة السر
        function openInstagram() {
            window.location.href = "https://www.instagram.com/_u/1.snmar";
        }

        // زر إنشاء حساب جديد
        function goToRegister() {
            window.location.href = "HsadgdedActivity.html";
        }

        function closeErrorDialog() {
            document.getElementById('errorDialog').style.display = 'none';
        }

        function showError(msg) {
            document.getElementById('loadingDialog').style.display = 'none';
            document.getElementById('errorMsg').innerText = msg;
            document.getElementById('errorDialog').style.display = 'flex';
        }

        // كود تسجيل الدخول بالكامل مطبق لعملية الفايربيس والحفظ
        function loginProcess() {
            const phone = document.getElementById('edittext1').value.trim();
            const password = document.getElementById('edittext2').value.trim();

            if (!phone || !password) {
                alert("يرجى إدخال الرقم وكلمة السر");
                return;
            }

            document.getElementById('loadingDialog').style.display = 'flex';

            fdb_users.child(phone).once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    const correctPassword = data.password ? String(data.password) : "";

                    if (password === correctPassword) {
                        localStorage.setItem("user_phone", phone);

                        if (data.name) {
                            localStorage.setItem("user_name", String(data.name));
                        }
                        if (data.shop_name) {
                            localStorage.setItem("shop_name", String(data.shop_name));
                        }

                        const updateMap = {
                            fcmToken: "web_token",
                            alihsn: "kf69"
                        };

                        fdb_users.child(phone).update(updateMap).then(() => {
                            setTimeout(() => {
                                document.getElementById('loadingDialog').style.display = 'none';
                                window.location.href = "AsasehActivity.html";
                            }, 500);
                        });

                    } else {
                        showError("كلمة السر غير صحيحة!");
                    }
                } else {
                    showError("هذا الرقم غير مسجل، يرجى إنشاء حساب جديد");
                }
            }).catch((error) => {
                showError("خطأ في الاتصال!");
            });
        }
    </script>
</body>
</html>
