<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق سنمار للآيفون</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="#FC5700">
    <meta name="apple-mobile-web-app-title" content="سنمار">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            text-align: center;
        }
        .header {
            background-color: #FC5700; /* لون سنمار البرتقالي */
            color: white;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
        }
        .container {
            padding: 20px;
        }
        .btn {
            background-color: #FC5700;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="header">مرحباً بك في سنمار (نسخة الويب)</div>
    
    <div class="container">
        <p>هذه النسخة مخصصة لأجهزة الآيفون وتعمل بكفاءة عالية.</p>
        <div id="loading">جاري جلب البيانات من السيرفر...</div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCtuy0-AraSFzMRxdWA3_B4fZg0RUahubs",
            authDomain: "alihsn-3c914.firebaseapp.com",
            databaseURL: "https://alihsn-3c914-default-rtdb.firebaseio.com",
            projectId: "alihsn-3c914",
            storageBucket: "alihsn-3c914.firebasestorage.app",
            messagingSenderId: "289747444726",
            appId: "1:289747444726:web:48ea4ef755efa4d66d9dd7",
            measurementId: "G-D02EQ3CMW2"
        };
        
        // تشغيل الفايربيس
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // قراءة مباشرة من مسار tabel
        database.ref("tabel").on("value", (snapshot) => {
            const data = snapshot.val();
            if(data) {
                document.getElementById("loading").innerText = "حالة التطبيق الحالية في السيرفر: " + data.mror;
            } else {
                document.getElementById("loading").innerText = "تم الاتصال بالسيرفر، ولكن المسار فارغ أو مقفل بالقواعد.";
            }
        }, (error) => {
            document.getElementById("loading").innerText = "خطأ في الاتصال: " + error.message;
        });
    </script>
</body>
</html>
