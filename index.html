<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق سنمار للآيفون</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="#FC5700">
    <meta name="apple-mobile-web-app-title" content="سنمار">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            color: #333;
        }
        .header {
            background-color: #FC5700;
            color: white;
            padding: 15px;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .container {
            padding: 15px;
        }
        #loading {
            text-align: center;
            color: #777;
            font-size: 16px;
            margin-top: 20px;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 15px;
        }
        .product-card {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            overflow: hidden;
            text-align: right;
            display: flex;
            flex-direction: column;
            border: 1px solid #eee;
        }
        .product-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background-color: #f0f0f0;
        }
        .product-details {
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }
        .product-name {
            font-size: 14px;
            font-weight: bold;
            color: #222;
            margin: 0 0 5px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 40px;
        }
        .price-container {
            margin: 5px 0;
        }
        .product-price {
            font-size: 15px;
            color: #FC5700;
            font-weight: bold;
        }
        .product-old-price {
            font-size: 12px;
            color: #999;
            text-decoration: line-through;
            margin-right: 5px;
        }
        .order-btn {
            background-color: #FC5700;
            color: white;
            border: none;
            width: 100%;
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="header">متجر سنمار</div>
    
    <div class="container">
        <div id="loading">جاري تحميل المنتجات الحية...</div>
        <div id="productsContainer" class="products-grid"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCtuy0-AraSFzMRxdWA3_B4fZg0RUahubs",
            authDomain: "alihsn-3c914.firebaseapp.com",
            databaseURL: "https://alihsn-3c914-default-rtdb.firebaseio.com",
            projectId: "alihsn-3c914",
            storageBucket: "alihsn-3c914.firebasestorage.app",
            messagingSenderId: "289747444726",
            appId: "1:289747444726:web:48ea4ef755efa4d66d9dd7",
            measurementId: "G-D02EQ3CMW2"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // دالة معالجة وتحويل روابط كوكل درايف لتعمل في المتصفح 100%
        function getDirectDriveUrl(url) {
            if (!url) return "https://via.placeholder.com/150";
            
            if (url.includes("drive.google.com")) {
                let fileId = "";
                
                // استخراج الـ ID إذا كان الرابط يحتوي على uc?id=
                if (url.includes("id=")) {
                    const parts = url.split("id=");
                    if (parts[1]) fileId = parts[1].split("&")[0];
                } 
                // استخراج الـ ID إذا كان الرابط يحتوي على /d/
                else if (url.includes("/d/")) {
                    const parts = url.split("/d/");
                    if (parts[1]) fileId = parts[1].split("/")[0];
                }
                
                if (fileId) {
                    // استخدام البروكسي المباشر للتغلب على حظر سفاري والآيفون لروابط درايف
                    return `https://docs.google.com/uc?export=view&id=${fileId}`;
                }
            }
            return url;
        }

        // جلب البيانات من مسار fbd
        database.ref("fbd").on("value", (snapshot) => {
            const productsContainer = document.getElementById("productsContainer");
            const loadingText = document.getElementById("loading");
            
            productsContainer.innerHTML = "";
            
            if (snapshot.exists()) {
                loadingText.style.display = "none";
                
                snapshot.forEach((childSnapshot) => {
                    const product = childSnapshot.val();
                    
                    const pName = product.name || "منتج بدون اسم";
                    const pPrice = product.sar || "0";
                    const pOldPrice = product.dna || "";
                    
                    // تحويل الرابط هنا قبل وضعه في الوسم
                    const pImage = getDirectDriveUrl(product.img1);

                    const cardHtml = `
                        <div class="product-card">
                            <img src="${pImage}" alt="${pName}" onerror="this.onerror=null; this.src='https://via.placeholder.com/150';">
                            <div class="product-details">
                                <h3 class="product-name">${pName}</h3>
                                <div class="price-container">
                                    <span class="product-price">${pPrice} د.ع</span>
                                    ${pOldPrice ? `<span class="product-old-price">${pOldPrice} د.ع</span>` : ''}
                                </div>
                                <button class="order-btn" onclick="orderProduct('${childSnapshot.key}', '${pName}')">اطلب الآن</button>
                            </div>
                        </div>
                    `;
                    
                    productsContainer.innerHTML += cardHtml;
                });
            } else {
                loadingText.innerText = "لا توجد منتجات معروضة حالياً.";
            }
        }, (error) => {
            document.getElementById("loading").innerText = "خطأ في جلب المنتجات: " + error.message;
        });

        function orderProduct(productId, productName) {
            alert("تم اختيار: " + productName + "\nسيتم تفعيل إرسال الطلب للأدمن قريباً!");
        }
    </script>
</body>
</html>
