<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سنمار - سلة المشتريات</title>
    <!-- مكتبات الفايربيس -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        @font-face {
            font-family: 'font1';
            src: url('fonts/font1.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'font1', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #FAFAFA;
            color: #111;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-bottom: 90px;
        }

        /* الهيدر العلوي */
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background-color: #FFFFFF;
        }

        .btn-back {
            background: none;
            border: none;
            cursor: pointer;
        }

        .btn-back svg {
            width: 28px;
            height: 28px;
        }

        .app-title {
            color: #FC5700;
            font-size: 24px;
            font-weight: bold;
        }

        .header-space {
            width: 28px;
        }

        .page-title {
            padding: 10px 20px 15px 20px;
            font-size: 18px;
            font-weight: bold;
            color: #111;
        }

        /* قائمة العناصر */
        .cart-container {
            padding: 0 16px;
            flex: 1;
        }

        .cart-item {
            background: #FFFFFF;
            border: 1px solid #EAEAEA;
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .product-img {
            width: 85px;
            height: 85px;
            object-fit: contain;
            border-radius: 8px;
        }

        .product-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .product-name {
            font-size: 15px;
            font-weight: bold;
            color: #222;
        }

        .price-text {
            font-size: 13px;
            color: #777;
        }

        .action-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 80px;
        }

        .btn-delete {
            background: #FF5252;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .btn-delete svg {
            width: 18px;
            height: 18px;
            fill: #FFFFFF;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-qty {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-qty svg {
            width: 22px;
            height: 22px;
            fill: #FC5700;
        }

        .qty-value {
            font-size: 14px;
            font-weight: bold;
            color: #222;
            min-width: 14px;
            text-align: center;
        }

        /* السلة الفارغة */
        .empty-state {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            color: #888;
        }

        /* زر اتمام الشراء السفلي */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px 20px;
            background: #FAFAFA;
        }

        .btn-checkout {
            width: 100%;
            background-color: #FC5700;
            color: #FFFFFF;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        /* النافذة المنبثقة (Custom Dialog) */
        .dialog-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .dialog-card {
            background: #FFFFFF;
            border-radius: 20px;
            padding: 30px;
            width: 80%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .dialog-msg {
            color: #000000;
            font-size: 16px;
            text-align: center;
        }

        .dialog-btn {
            background-color: #FC5700;
            color: #FFFFFF;
            border: none;
            border-radius: 10px;
            padding: 10px 30px;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- Header Toolbar -->
    <div class="toolbar">
        <button class="btn-back" onclick="window.history.back()">
            <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7" stroke="#FC5700" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="app-title">سنمار</div>
        <div class="header-space"></div>
    </div>

    <div class="page-title">سلة المشتريات</div>

    <!-- قائمة المنتجات (ListView) -->
    <div id="listview1" class="cart-container"></div>

    <!-- لينر السلة الفارغة (lin_empty) -->
    <div id="lin_empty" class="empty-state">
        <p>السلة فارغة</p>
    </div>

    <!-- زر اتمام الشراء -->
    <div class="bottom-bar">
        <button class="btn-checkout" onclick="onCheckoutClick()">اتمام الشراء</button>
    </div>

    <!-- Custom Dialog -->
    <div id="customDialog" class="dialog-overlay">
        <div class="dialog-card">
            <div id="dialogMsg" class="dialog-msg"></div>
            <button class="dialog-btn" onclick="closeDialog()">موافق</button>
        </div>
    </div>

    <script>
        // 1. تهيئة الفايربيس (قاعدة البيانات الخاصة بك)
        const firebaseConfig = {
            databaseURL: "https://alihsn-3c914-default-rtdb.firebaseio.com"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // 2. دالة التنسيق الاحترافي للأرقام
        function formatNumber(val) {
            return new Intl.NumberFormat('en-US').format(val);
        }

        // 3. كود الدايلوج (showCustomDialog)
        function showCustomDialog(message) {
            document.getElementById('dialogMsg').innerText = message;
            document.getElementById('customDialog').style.display = 'flex';
        }

        function closeDialog() {
            document.getElementById('customDialog').style.display = 'none';
        }

        // جلب معرف سلة المستخدم بناءً على رقمه (cart_list_userPhone)
        const userPhone = localStorage.getItem('user_phone') || 'default';
        const cartKey = 'cart_list_' + userPhone;

        function getBasketList() {
            const savedData = localStorage.getItem(cartKey);
            if (!savedData || savedData === "[]") return [];
            try {
                return JSON.parse(savedData);
            } catch (e) {
                return [];
            }
        }

        function saveBasketList(list) {
            localStorage.setItem(cartKey, JSON.stringify(list));
        }

        // 4. بناء وعرض القائمة (منطق onCreate + getView)
        function renderCart() {
            const list = getBasketList();
            const lv = document.getElementById('listview1');
            const lin_empty = document.getElementById('lin_empty');

            lv.innerHTML = '';

            if (list.length === 0) {
                lv.style.display = 'none';
                if (lin_empty) lin_empty.style.display = 'flex';
                return;
            }

            lv.style.display = 'block';
            if (lin_empty) lin_empty.style.display = 'none';

            list.forEach((item, pos) => {
                const count = parseInt(item.count || 1);
                const currentPriceTotal = parseFloat(String(item.price).replace(/[^0-9.]/g, '')) || 0;
                const currentSarTotal = parseFloat(String(item.sar_price).replace(/[^0-9.]/g, '')) || 0;

                const unitUser = currentPriceTotal / count;
                const unitSar = currentSarTotal / count;

                const itemCard = document.createElement('div');
                itemCard.className = 'cart-item';
                itemCard.innerHTML = `
                    <img id="imageview1" class="product-img" src="${item.img1 || ''}" alt="img">
                    <div class="product-details">
                        <div id="textview1" class="product-name">${item.name || ''}</div>
                        <div id="textview2" class="price-text">سعر الجملة: ${formatNumber(currentSarTotal)}</div>
                        <div id="textview3" class="price-text">سعر الزبون: ${formatNumber(currentPriceTotal)}</div>
                    </div>
                    <div class="action-column">
                        <button id="imageview2" class="btn-delete" onclick="removeItem(${pos})">
                            <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                        </button>
                        <div class="quantity-control">
                            <button id="img_plus" class="btn-qty" onclick="increaseQty(${pos}, ${unitUser}, ${unitSar})">
                                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
                            </button>
                            <span id="txt_count" class="qty-value">${count}</span>
                            <button id="img_minus" class="btn-qty" onclick="decreaseQty(${pos}, ${unitUser}, ${unitSar})">
                                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11H7v-2h10v2z"/></svg>
                            </button>
                        </div>
                    </div>
                `;
                lv.appendChild(itemCard);
            });
        }

        // كود التحكم بالكمية (img_plus)
        function increaseQty(pos, unitUser, unitSar) {
            const list = getBasketList();
            const item = list[pos];
            if (!item) return;

            let count = parseInt(item.count || 1);
            let stockAvailable = 0;

            try {
                if (item.stock) {
                    stockAvailable = parseInt(String(item.stock).replace(/[^0-9]/g, ''));
                } else {
                    stockAvailable = 999;
                }
            } catch (e) { stockAvailable = 0; }

            let totalInCart = 0;
            list.forEach(i => { totalInCart += parseInt(i.count || 1); });

            if (totalInCart < 5) {
                if (count < stockAvailable) {
                    updateData(pos, count + 1, unitUser, unitSar);
                } else {
                    alert("الكمية نافذة! المتوفر فقط (" + stockAvailable + ") قطع");
                }
            } else {
                alert("السلة ممتلئة (5 قطع)");
            }
        }

        // كود التحكم بالكمية (img_minus)
        function decreaseQty(pos, unitUser, unitSar) {
            const list = getBasketList();
            const item = list[pos];
            if (!item) return;

            let count = parseInt(item.count || 1);
            if (count > 1) {
                updateData(pos, count - 1, unitUser, unitSar);
            }
        }

        function updateData(p, nc, uPrice, uSar) {
            const list = getBasketList();
            list[p].count = String(nc);
            list[p].price = String(Math.round(uPrice * nc));
            list[p].sar_price = String(Math.round(uSar * nc));

            saveBasketList(list);
            renderCart();
        }

        // كود زر الحذف (imageview2)
        function removeItem(pos) {
            const list = getBasketList();
            list.splice(pos, 1);
            saveBasketList(list);
            renderCart();
        }

        // 5. كود زر "اتمام الشراء" (التحقق من الإنترنت والمخزن في fbd)
        function onCheckoutClick() {
            if (!navigator.onLine) {
                showCustomDialog("يرجى الاتصال بالإنترنت لإتمام الطلب");
                return;
            }

            const basketList = getBasketList();
            if (basketList.length === 0) {
                showCustomDialog("السلة فارغة");
                return;
            }

            // فحص قاعدة بيانات الفايربيز مسار (fbd)
            db.ref("fbd").once("value").then(snapshot => {
                let isAllAvailable = true;
                let unavailableProductName = "";

                for (let i = 0; i < basketList.length; i++) {
                    const cartProductId = String(basketList[i].id);
                    let foundInFirebase = false;

                    snapshot.forEach(child => {
                        const val = child.val();
                        if (String(val.id) === cartProductId) {
                            foundInFirebase = true;
                            const realStockStr = String(val.stock || "").replace(/[^0-9]/g, "");
                            const realStock = realStockStr === "" ? 0 : parseInt(realStockStr);

                            if (realStock <= 0) {
                                isAllAvailable = false;
                                unavailableProductName = String(val.name || "");
                            }
                        }
                    });

                    if (!isAllAvailable) break;

                    if (!foundInFirebase) {
                        isAllAvailable = false;
                        unavailableProductName = String(basketList[i].name || "");
                        break;
                    }
                }

                if (!isAllAvailable) {
                    showCustomDialog("عذراً، المنتج (" + unavailableProductName + ") نفد من المخزن، يرجى حذفه للمتابعة.");
                } else {
                    let finalOrderTotal = 0;
                    let finalGmlhTotal = 0;

                    basketList.forEach(item => {
                        if (item.price) {
                            finalOrderTotal += parseFloat(String(item.price).replace(/[^0-9.]/g, '')) || 0;
                        }
                        if (item.sar_price) {
                            finalGmlhTotal += parseFloat(String(item.sar_price).replace(/[^0-9.]/g, '')) || 0;
                        }
                    });

                    // الانقال لصفحة OrderActivity.html مع الحقول المحددة
                    const params = new URLSearchParams();
                    params.append("total_price", Math.round(finalOrderTotal));
                    params.append("gmlhkle", Math.round(finalGmlhTotal));
                    params.append("full_cart", JSON.stringify(basketList));

                    if (basketList.length > 0) {
                        params.append("img1", basketList[0].img1 || "");
                        params.append("name", basketList[0].name || "");
                    }

                    window.location.href = "OrderActivity.html?" + params.toString();
                }
            }).catch(error => {
                showCustomDialog("حدث خطأ في الاتصال، يرجى المحاولة لاحقاً");
            });
        }

        document.addEventListener("DOMContentLoaded", function() {
            renderCart();
        });
    </script>
</body>
</html>
