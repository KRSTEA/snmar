<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سنمار - سلة المشتريات</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        @font-face {
            font-family: 'font1';
            src: url('fonts/font1.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'font1', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #FFFFFF;
            color: #111111;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-bottom: 90px;
        }

        /* Toolbar / Header */
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background-color: #FFFFFF;
        }

        .btn-back {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .btn-back svg {
            width: 28px;
            height: 28px;
        }

        .app-title {
            color: #FF5500;
            font-size: 26px;
            font-weight: bold;
            letter-spacing: -0.5px;
        }

        .header-space {
            width: 28px;
        }

        .page-title {
            padding: 10px 24px 20px 24px;
            font-size: 20px;
            font-weight: bold;
            color: #222222;
        }

        /* Cart List Container */
        .cart-container {
            padding: 0 16px;
            flex: 1;
        }

        /* Cart Item Card - Matching Image Design */
        .cart-item {
            background: #FFFFFF;
            border: 1px solid #EAEAEA;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }

        .product-img {
            width: 90px;
            height: 90px;
            object-fit: contain;
            border-radius: 8px;
            flex-shrink: 0;
        }

        .product-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .product-name {
            font-size: 16px;
            font-weight: bold;
            color: #111111;
        }

        .price-text {
            font-size: 14px;
            color: #888888;
            font-weight: normal;
        }

        .action-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 85px;
        }

        /* Delete Button */
        .btn-delete {
            background: #FF5252;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .btn-delete svg {
            width: 18px;
            height: 18px;
            fill: #FFFFFF;
        }

        /* Quantity Control Buttons */
        .quantity-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-qty {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .btn-qty svg {
            width: 22px;
            height: 22px;
            fill: #FF5500;
        }

        .qty-value {
            font-size: 15px;
            font-weight: bold;
            color: #222222;
            min-width: 16px;
            text-align: center;
        }

        /* Empty Cart View (lin_empty) */
        .empty-state {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            color: #888888;
            font-size: 18px;
        }

        /* Bottom Checkout Button Bar */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px 20px 24px 20px;
            background: #FFFFFF;
        }

        .btn-checkout {
            width: 100%;
            background-color: #FF5500;
            color: #FFFFFF;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 85, 0, 0.25);
        }

        /* Custom Dialog Overlay */
        .dialog-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .dialog-card {
            background: #FFFFFF;
            border-radius: 20px;
            padding: 24px;
            width: 85%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .dialog-msg {
            color: #111111;
            font-size: 16px;
            text-align: center;
            line-height: 1.5;
        }

        .dialog-btn {
            background-color: #FF5500;
            color: #FFFFFF;
            border: none;
            border-radius: 12px;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- Toolbar -->
    <div class="toolbar">
        <button class="btn-back" onclick="window.history.back()">
            <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7" stroke="#FF5500" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="app-title">سنمار</div>
        <div class="header-space"></div>
    </div>

    <!-- Page Title -->
    <div class="page-title">سلة المشتريات</div>

    <!-- Cart Items List (listview1) -->
    <div id="listview1" class="cart-container"></div>

    <!-- Empty Basket View (lin_empty) -->
    <div id="lin_empty" class="empty-state">
        <p>السلة فارغة</p>
    </div>

    <!-- Bottom Bar -->
    <div class="bottom-bar">
        <button class="btn-checkout" onclick="onCheckoutClick()">اتمام الشراء</button>
    </div>

    <!-- Alert Dialog -->
    <div id="customDialog" class="dialog-overlay">
        <div class="dialog-card">
            <div id="dialogMsg" class="dialog-msg"></div>
            <button class="dialog-btn" onclick="closeDialog()">موافق</button>
        </div>
    </div>

    <script>
        // التهيئة مع الفايربيس
        const firebaseConfig = {
            databaseURL: "https://alihsn-3c914-default-rtdb.firebaseio.com"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // 1. دالة معالجة رابط Google Drive لإظهاره مباشرة مثل Glide
        function convertDriveUrl(url) {
            if (!url) return '';
            const rawUrl = String(url).trim();
            if (rawUrl.includes('drive.google.com')) {
                let fileId = '';
                if (rawUrl.includes('/d/')) {
                    fileId = rawUrl.split('/d/')[1].split('/')[0].split('?')[0];
                } else if (rawUrl.includes('id=')) {
                    fileId = rawUrl.split('id=')[1].split('&')[0];
                }
                if (fileId) {
                    return 'https://lh3.googleusercontent.com/u/0/d/' + fileId;
                }
            }
            return rawUrl;
        }

        // 2. دالة تنسيق الأرقام بالفواصل مثل DecimalFormat(#,###)
        function formatNumber(val) {
            return new Intl.NumberFormat('en-US').format(Math.round(val));
        }

        function showCustomDialog(message) {
            document.getElementById('dialogMsg').innerText = message;
            document.getElementById('customDialog').style.display = 'flex';
        }

        function closeDialog() {
            document.getElementById('customDialog').style.display = 'none';
        }

        // 3. مفتاح السلة الخاص بالمستخدم من SharedPreferences (localStorage)
        const userPhone = localStorage.getItem('user_phone') || 'default';
        const cartKey = 'cart_list_' + userPhone;

        function getBasketList() {
            const savedData = localStorage.getItem(cartKey) || localStorage.getItem('data') || "";
            if (!savedData || savedData === "[]") return [];
            try {
                return JSON.parse(savedData);
            } catch (e) {
                return [];
            }
        }

        function saveBasketList(list) {
            localStorage.setItem(cartKey, JSON.stringify(list));
        }

        // 4. عرض عناصر السلة مع الفحص وإظهار اللينر أو القائمة
        function renderCart() {
            const list = getBasketList();
            const lv = document.getElementById('listview1');
            const lin_empty = document.getElementById('lin_empty');

            lv.innerHTML = '';

            if (list.length === 0) {
                lv.style.display = 'none';
                if (lin_empty) lin_empty.style.display = 'flex';
                return;
            }

            lv.style.display = 'block';
            if (lin_empty) lin_empty.style.display = 'none';

            list.forEach((item, pos) => {
                const count = parseInt(item.count || 1);
                
                // استخراج السعر وتنظيفه من أي رموز غير رقمية
                const currentPriceTotal = parseFloat(String(item.price || 0).replace(/[^0-9.]/g, '')) || 0;
                const currentSarTotal = parseFloat(String(item.sar_price || 0).replace(/[^0-9.]/g, '')) || 0;

                const unitUser = currentPriceTotal / count;
                const unitSar = currentSarTotal / count;

                // قراءة رابط الصورة المسجل تحت المفتاح img1 ومعالجته لدرايف
                const rawImg = item.img1 || item.image1 || item.img || '';
                const displayImg = convertDriveUrl(rawImg);

                const itemCard = document.createElement('div');
                itemCard.className = 'cart-item';
                itemCard.innerHTML = `
                    <img id="imageview1" class="product-img" src="${displayImg}" alt="img" onerror="this.src='https://via.placeholder.com/90'">
                    <div class="product-details">
                        <div id="textview1" class="product-name">${item.name || ''}</div>
                        <div id="textview2" class="price-text">سعر الجملة: ${formatNumber(currentSarTotal)}</div>
                        <div id="textview3" class="price-text">سعر الزبون: ${formatNumber(currentPriceTotal)}</div>
                    </div>
                    <div class="action-column">
                        <button id="imageview2" class="btn-delete" onclick="removeItem(${pos})">
                            <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                        </button>
                        <div class="quantity-control">
                            <button id="img_plus" class="btn-qty" onclick="increaseQty(${pos}, ${unitUser}, ${unitSar})">
                                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
                            </button>
                            <span id="txt_count" class="qty-value">${count}</span>
                            <button id="img_minus" class="btn-qty" onclick="decreaseQty(${pos}, ${unitUser}, ${unitSar})">
                                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11H7v-2h10v2z"/></svg>
                            </button>
                        </div>
                    </div>
                `;
                lv.appendChild(itemCard);
            });
        }

        // 5. زيادة الكمية مع التحقق من الحد الأقصى والمخزن
        function increaseQty(pos, unitUser, unitSar) {
            const list = getBasketList();
            const item = list[pos];
            if (!item) return;

            let count = parseInt(item.count || 1);
            let stockAvailable = 0;

            try {
                if (item.stock) {
                    stockAvailable = parseInt(String(item.stock).replace(/[^0-9]/g, ''));
                } else {
                    stockAvailable = 999;
                }
            } catch (e) { stockAvailable = 0; }

            let totalInCart = 0;
            list.forEach(i => { totalInCart += parseInt(i.count || 1); });

            if (totalInCart < 5) {
                if (count < stockAvailable) {
                    updateData(pos, count + 1, unitUser, unitSar);
                } else {
                    showCustomDialog("الكمية نافذة! المتوفر فقط (" + stockAvailable + ") قطع");
                }
            } else {
                showCustomDialog("السلة ممتلئة (5 قطع)");
            }
        }

        // 6. تقليل الكمية
        function decreaseQty(pos, unitUser, unitSar) {
            const list = getBasketList();
            const item = list[pos];
            if (!item) return;

            let count = parseInt(item.count || 1);
            if (count > 1) {
                updateData(pos, count - 1, unitUser, unitSar);
            }
        }

        // 7. تحديث البيانات وحفظها في SharedPreferences/localStorage
        function updateData(p, nc, uPrice, uSar) {
            const list = getBasketList();
            list[p].count = String(nc);
            list[p].price = String(Math.round(uPrice * nc));
            list[p].sar_price = String(Math.round(uSar * nc));

            saveBasketList(list);
            renderCart();
        }

        // 8. حذف عنصر من السلة
        function removeItem(pos) {
            const list = getBasketList();
            list.splice(pos, 1);
            saveBasketList(list);
            renderCart();
        }

        // 9. زر إتمام الشراء والتحقق من الفايربيس
        function onCheckoutClick() {
            if (!navigator.onLine) {
                showCustomDialog("يرجى الاتصال بالإنترنت لإتمام الطلب");
                return;
            }

            const basketList = getBasketList();
            if (basketList.length === 0) {
                showCustomDialog("السلة فارغة");
                return;
            }

            db.ref("fbd").once("value").then(snapshot => {
                let isAllAvailable = true;
                let unavailableProductName = "";

                for (let i = 0; i < basketList.length; i++) {
                    const cartProductId = String(basketList[i].id);
                    let foundInFirebase = false;

                    snapshot.forEach(child => {
                        const val = child.val();
                        if (String(val.id) === cartProductId) {
                            foundInFirebase = true;
                            const realStockStr = String(val.stock || "").replace(/[^0-9]/g, "");
                            const realStock = realStockStr === "" ? 0 : parseInt(realStockStr);

                            if (realStock <= 0) {
                                isAllAvailable = false;
                                unavailableProductName = String(val.name || "");
                            }
                        }
                    });

                    if (!isAllAvailable) break;

                    if (!foundInFirebase) {
                        isAllAvailable = false;
                        unavailableProductName = String(basketList[i].name || "");
                        break;
                    }
                }

                if (!isAllAvailable) {
                    showCustomDialog("عذراً، المنتج (" + unavailableProductName + ") نفد من المخزن، يرجى حذفه للمتابعة.");
                } else {
                    let finalOrderTotal = 0;
                    let finalGmlhTotal = 0;

                    basketList.forEach(item => {
                        if (item.price) {
                            finalOrderTotal += parseFloat(String(item.price).replace(/[^0-9.]/g, '')) || 0;
                        }
                        if (item.sar_price) {
                            finalGmlhTotal += parseFloat(String(item.sar_price).replace(/[^0-9.]/g, '')) || 0;
                        }
                    });

                    const params = new URLSearchParams();
                    params.append("total_price", Math.round(finalOrderTotal));
                    params.append("gmlhkle", Math.round(finalGmlhTotal));
                    params.append("full_cart", JSON.stringify(basketList));

                    if (basketList.length > 0) {
                        params.append("img1", basketList[0].img1 || "");
                        params.append("name", basketList[0].name || "");
                    }

                    window.location.href = "OrderActivity.html?" + params.toString();
                }
            }).catch(error => {
                showCustomDialog("حدث خطأ في الاتصال، يرجى المحاولة لاحقاً");
            });
        }

        document.addEventListener("DOMContentLoaded", function() {
            renderCart();
        });
    </script>
</body>
</html>
